{% extends 'base.html' %}

{% block title %}Login - PromoCir{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
    <div class="glass-card" style="width: 100%; max-width: 420px; text-align: center;">
        <h1 style="font-size: 32px; color: var(--accent); margin-bottom: 4px;">PromoCir</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 32px;">CRM de Promotores Médicos</p>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group" style="text-align: left;">
                <label>Email</label>
                <input type="email" name="email" class="glass-input" placeholder="tu@email.com" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Contraseña</label>
                <input type="password" name="password" class="glass-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="glass-btn glass-btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
                Iniciar Sesión
            </button>
        </form>
        
        <p style="margin-top: 24px; font-size: 13px; color: var(--text-muted);">
            Sistema exclusivo para promotores médicos de Querétaro
        </p>
    </div>
</div>
{% endblock %}
